name: Build Admin APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    env:
      EXPO_PUBLIC_API_URL: https://api.ghotlyai.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-app/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Decode release keystore
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          echo "Decoded keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Decoded keystore is suspiciously small ($SIZE bytes) - the ANDROID_RELEASE_KEYSTORE_BASE64 secret is likely truncated or corrupted. Re-copy the full contents of keystore-b64-output.txt and update the secret."
            exit 1
          fi
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" > /dev/null
          echo "Keystore verified: alias '$ANDROID_RELEASE_KEY_ALIAS' found and readable."
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # The prebuilt gradle.properties caps the JVM at 2 GiB, which is enough for most builds
      # but D8 dex merging hit OutOfMemoryError once. Runners have 7 GiB, so give Gradle 4.
      - name: Raise Gradle JVM memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          grep -q '^org.gradle.jvmargs=' android/gradle.properties || echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' >> android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      - name: Build Android Release APK
        working-directory: admin-app/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      - name: Locate and prepare APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="job-alert-admin-v${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: admin-app/${{ steps.apk.outputs.apk_name }}
          retention-days: 90

      # softprops/action-gh-release kept dying with "Error saving asset" on the ~50 MB APK,
      # so the release is published with the preinstalled gh CLI and the upload is retried
      # until it lands. The artifact above is always there as a fallback.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: admin-app-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          TITLE: Job Alert Admin v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          APK: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -u
          NOTES="Automated build from commit ${GITHUB_SHA}."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploaded $APK on attempt $attempt"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring) + " bytes")'
              exit 0
            fi
            echo "Upload attempt $attempt failed; waiting before retrying..."
            sleep $((attempt * 20))
          done
          echo "::error::Release asset upload failed after 5 attempts (the APK is still available as a workflow artifact)"
          exit 1

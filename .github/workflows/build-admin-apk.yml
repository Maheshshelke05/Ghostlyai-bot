name: Build Admin APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    env:
      EXPO_PUBLIC_API_URL: https://api.ghotlyai.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-app/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Decode release keystore
        run: echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: admin-app/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

      - name: Locate and prepare APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="job-alert-admin-v${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: admin-app/${{ steps.apk.outputs.apk_name }}
          retention-days: 90

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-app-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: Job Alert Admin v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: Automated build from commit ${{ github.sha }}.
          files: admin-app/${{ steps.apk.outputs.apk_name }}
          make_latest: true

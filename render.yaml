# Render Blueprint. Deploy: render.com -> New -> Blueprint -> pick this repo.
#
# NOTE: production has moved to a self-hosted VPS (docs/DEPLOY.md) - Render's own database was
# in a different region than this app's server, and every query paid that network round trip.
# This file is kept as a free/no-VPS fallback option, not what's currently live.
#
# Single FREE web service, no card required. The digest/reminders/expiry/broadcast scheduler
# runs embedded inside this same process (RUN_SCHEDULER_IN_API=true) instead of as a separate
# Render "worker" service - Render has no free tier for background workers at all, only for web
# services, so this is what makes a $0 deployment possible. Trade-off: Render's free web
# services spin down after 15 minutes with no incoming HTTP traffic, and while asleep NO code
# runs at all (not even the scheduler) - see docs/DEPLOY_RENDER.md for the free external
# keep-alive ping this depends on to actually hit the 09:00/18:00 IST digest times reliably, and
# for how to split this back into a separate paid worker service once real revenue justifies it
# (a few line changes, no code changes needed).
#
# Uses external managed Postgres (Neon) and Redis (Upstash) rather than Render's own
# database/key-value services, since that's what this project is already configured for - no
# databases: or keyvalue service block needed here. Every sync:false var below is left for you
# to fill in through the Render dashboard the first time the blueprint runs; nothing secret is
# stored in this file.

services:
  - type: web
    name: ghostlyai-api
    runtime: docker
    plan: free
    # Was "singapore" - the Neon database is in Ohio (us-east-2), so every single query paid a
    # Singapore<->Ohio round trip (~250-300ms one-way on a good day). Matching the region cuts
    # that to a same-datacenter-ish hop. NOTE: Render does not migrate an already-running
    # service's region just because this file changes - the live service still needs to be
    # recreated in "ohio" via the dashboard (or a fresh Blueprint deploy) for this to take
    # effect; see docs/DEPLOY_RENDER.md.
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_SCHEDULER_IN_API
        value: "true"
      # Custom domain (api.ghotlyai.in) - set explicitly rather than relying on Render's
      # auto-injected RENDER_EXTERNAL_URL, which keeps showing the *.onrender.com address
      # even after a custom domain is attached. See docs/DEPLOY_RENDER.md for the Cloudflare
      # CNAME + Render "Custom Domain" steps this depends on.
      - key: BASE_URL
        value: https://api.ghotlyai.in
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://... from Neon (or wherever); keep the +asyncpg scheme
      - key: REDIS_URL
        sync: false # rediss://... from Upstash (rediss:// = TLS, not redis-cli's shell command)
      - key: BOT_TOKEN
        sync: false # from @BotFather
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false # random 32+ chars, e.g. `openssl rand -hex 24`
      - key: SUPPORT_USERNAME
        sync: false # your Telegram @username, without the @
      - key: ADMIN_ALERT_CHAT_ID
        sync: false # your numeric Telegram id, from @userinfobot
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false # random 64+ chars, e.g. `openssl rand -hex 32`
      - key: JWT_EXPIRE_HOURS
        value: "72"
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<api_key>:<api_secret>@<cloud_name>, from cloudinary.com dashboard
      - key: MAX_RESUME_MB
        value: "10"
